[project]
name = "agente_ia_professor"
version = "0.1.0"
description = "agente_ia_professor using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=1.15.41,<2.0.0"
]

[project.scripts]
agente_ia_professor = "agente_ia_professor.main:run"
run_crew = "agente_ia_professor.main:run"
train = "agente_ia_professor.main:train"
replay = "agente_ia_professor.main:replay"
test = "agente_ia_professor.main:test"
run_with_trigger = "agente_ia_professor.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
project_id = "65c0ae86-b07c-408b-85f2-a01d1ed8c60c"
